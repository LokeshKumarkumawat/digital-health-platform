name: Build and Deploy to ECS

on:
  push:
    branches:
      - main        # main push → prod deploy
      - develop     # develop push → dev deploy

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    # कौन सा environment deploy होगा
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      # ─── Step 1: Code लो ───────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─── Step 2: AWS Login ─────────────────────────────
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/github-actions-role
          aws-region: ap-south-1

      # ─── Step 3: Java Build ────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      # ─── Step 4: तुम्हारी Script चलाओ ─────────────────
      - name: Build & Push Docker Image
        id: build          # ← ID ज़रूरी है (output के लिए)
        run: |
          # Environment decide करो
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi

          chmod +x ./build-and-push.sh
          ./build-and-push.sh ${{ github.sha }} ${ENV}

      # ─── Step 5: ECS Deploy ────────────────────────────
      - name: Deploy to ECS
        run: |
          # Environment decide करो
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi

          aws ecs update-service \
            --cluster digital-health-platform-${ENV}-cluster \
            --service digital-health-platform-${ENV} \
            --force-new-deployment \
            --region ap-south-1

      # ─── Step 6: Deploy होने का Wait करो ──────────────
      - name: Wait for Deployment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi

          aws ecs wait services-stable \
            --cluster digital-health-platform-${ENV}-cluster \
            --services digital-health-platform-${ENV} \
            --region ap-south-1

          echo "✅ Deployment Complete!"